name: release-demos

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'
  BUILD_DIR: build
  STAGE_DIR: package/LfQuick-Demos-Windows-x64

jobs:
  windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Architecture boundaries
        run: python tools/check_architecture.py

      - name: Configure
        run: >-
          cmake -S . -B $env:BUILD_DIR -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DLFQUICK_BUILD_WIDGET_BRIDGE=ON
          -DLFQUICK_BUILD_HYBRID_DEMO=ON
          -DLFQUICK_BUILD_MEDICAL_DEMO=ON
          -DLFQUICK_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build $env:BUILD_DIR --parallel

      - name: Test
        run: ctest --test-dir $env:BUILD_DIR --output-on-failure -C Release

      - name: Install deployable demos
        run: cmake --install $env:BUILD_DIR --config Release --prefix $env:STAGE_DIR

      - name: Add package metadata
        shell: pwsh
        run: |
          Copy-Item README.md "$env:STAGE_DIR/README.md" -Force
          Copy-Item THIRD_PARTY_NOTICES.md "$env:STAGE_DIR/THIRD_PARTY_NOTICES.md" -Force
          @"
          LfQuick demo package
          Ref: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Qt: $env:QT_VERSION
          Configuration: Release
          Generated by: $env:GITHUB_WORKFLOW / $env:GITHUB_RUN_ID
          "@ | Set-Content "$env:STAGE_DIR/BUILD_INFO.txt"

      - name: Validate package layout
        shell: pwsh
        run: |
          $medical = Join-Path $env:STAGE_DIR 'bin/LfQuickMedicalDemo.exe'
          $hybrid = Join-Path $env:STAGE_DIR 'bin/LfQuickHybridDemo.exe'
          if (-not (Test-Path $medical)) { throw "Missing $medical" }
          if (-not (Test-Path $hybrid)) { throw "Missing $hybrid" }

      - name: Create zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $name = "LfQuick-Demos-Windows-x64-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path "$env:STAGE_DIR/*" -DestinationPath "artifacts/$name" -CompressionLevel Optimal -Force
          "RELEASE_ZIP=$name" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LfQuick-Demos-Windows-x64-${{ github.ref_name }}
          path: artifacts/${{ env.RELEASE_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/${{ env.RELEASE_ZIP }}

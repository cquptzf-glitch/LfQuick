name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows-qt683:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Architecture boundaries
        run: python tools/check_architecture.py
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLFQUICK_BUILD_WIDGET_BRIDGE=ON -DLFQUICK_BUILD_HYBRID_DEMO=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

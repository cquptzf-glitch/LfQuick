name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  BUILD_DIR: build
  STAGE_DIR: package/LfQuick-Demos-Windows-x64

jobs:
  windows-qt683:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          modules: 'qtgraphs'
          cache: true

      - name: Architecture boundaries
        run: python tools/check_architecture.py

      - name: Configure MSVC2022 x64
        run: >-
          cmake -S . -B $env:BUILD_DIR
          -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DLFQUICK_BUILD_WIDGET_BRIDGE=ON
          -DLFQUICK_BUILD_HYBRID_DEMO=ON
          -DLFQUICK_BUILD_MEDICAL_DEMO=ON
          -DLFQUICK_BUILD_CHARTS=ON
          -DLFQUICK_BUILD_QT_GRAPHS_ADAPTER=ON
          -DLFQUICK_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build $env:BUILD_DIR --config Release --parallel

      - name: Test
        run: ctest --test-dir $env:BUILD_DIR --output-on-failure -C Release

      - name: Failed test diagnostics
        if: failure()
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $testDir = Join-Path $env:BUILD_DIR 'tests/Release'
          Write-Host '=== Test runtime directory ==='
          if (Test-Path $testDir) {
            Get-ChildItem $testDir | Sort-Object Name | Select-Object Name, Length
          }

          $lastTestLog = Join-Path $env:BUILD_DIR 'Testing/Temporary/LastTest.log'
          Write-Host '=== CTest LastTest.log ==='
          if (Test-Path $lastTestLog) {
            Get-Content $lastTestLog
          } else {
            Write-Host 'LastTest.log not found'
          }

          $dataViewTest = Join-Path $testDir 'tst_dataview.exe'
          if (-not (Test-Path $dataViewTest)) {
            Write-Host "Missing $dataViewTest"
            exit 0
          }

          $testFunctions = @(
            'tableModelSupportsRolesEditingAndLookup',
            'proxyFiltersAcrossColumnsAndMapsRows',
            'columnStateRestoresByStableIdNotOldIndex',
            'columnConfigStoreRoundTripsAndRejectsSchemaMismatch',
            'editTransactionCommitsOnlyAfterValidation',
            'editTransactionRollbackAndValidationFailureLeaveModelUntouched',
            'selectionControllerSupportsBatchRowsAndCurrentCell'
          )

          Write-Host '=== Isolated tst_dataview slots ==='
          foreach ($testFunction in $testFunctions) {
            $outputFile = Join-Path $env:RUNNER_TEMP "tst_dataview-$testFunction.txt"
            Remove-Item $outputFile -ErrorAction SilentlyContinue
            & $dataViewTest $testFunction -v2 -o "$outputFile,txt"
            $exitCode = $LASTEXITCODE
            Write-Host "--- $testFunction : exit $exitCode ---"
            if (Test-Path $outputFile) {
              Get-Content $outputFile
            } else {
              Write-Host 'QtTest output file was not created'
            }
          }
          exit 0

      - name: Install deployable demos
        run: cmake --install $env:BUILD_DIR --config Release --prefix $env:STAGE_DIR

      - name: Add package metadata
        shell: pwsh
        run: |
          Copy-Item README.md "$env:STAGE_DIR/README.md" -Force
          Copy-Item THIRD_PARTY_NOTICES.md "$env:STAGE_DIR/THIRD_PARTY_NOTICES.md" -Force
          @"
          LfQuick demo package
          Commit: $env:GITHUB_SHA
          Qt: $env:QT_VERSION
          Toolchain: MSVC2022 x64
          Configuration: Release
          Generated by: $env:GITHUB_WORKFLOW / $env:GITHUB_RUN_ID
          "@ | Set-Content "$env:STAGE_DIR/BUILD_INFO.txt"

      - name: Validate package layout
        shell: pwsh
        run: |
          $medical = Join-Path $env:STAGE_DIR 'bin/LfQuickMedicalDemo.exe'
          $hybrid = Join-Path $env:STAGE_DIR 'bin/LfQuickHybridDemo.exe'
          if (-not (Test-Path $medical)) { throw "Missing $medical" }
          if (-not (Test-Path $hybrid)) { throw "Missing $hybrid" }
          Get-ChildItem $env:STAGE_DIR -Recurse | Select-Object FullName

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: LfQuick-Demos-Windows-x64-${{ github.sha }}
          path: ${{ env.STAGE_DIR }}
          if-no-files-found: error
          retention-days: 14
